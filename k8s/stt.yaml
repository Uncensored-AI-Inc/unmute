apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  namespace: speech-io
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt
  template:
    metadata:
      labels:
        app: stt
    spec:
      containers:
        - name: stt
          image: ghcr.io/uncensored-ai-inc/moshi-server:latest
          args: ['worker', '--config', 'configs/stt.toml']
          ports:
            - containerPort: 8080
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
            - name: NVIDIA_VISIBLE_DEVICES
              value: 'all'
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: 'compute,utility'
            - name: PATH
              value: '/root/.cargo/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
            - name: LD_LIBRARY_PATH
              value: '/usr/local/cuda/lib64:/usr/local/cuda/lib'
            - name: CUDA_HOME
              value: '/usr/local/cuda'
            - name: RUST_LOG
              value: 'info'
            - name: CARGO_LOG
              value: 'info'
          volumeMounts:
            - name: shared-cargo-registry
              mountPath: /root/.cargo/registry
            - name: stt-target
              mountPath: /app/target
            - name: shared-uv-cache
              mountPath: /root/.cache/uv
            - name: shared-models
              mountPath: /models
            - name: stt-logs
              mountPath: /logs
          resources:
            requests:
              nvidia.com/gpu: 1
              memory: 4Gi
              cpu: 2
            limits:
              nvidia.com/gpu: 1
              memory: 8Gi
              cpu: 4
          startupProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 120 # 120 * 30s = 60 minutes for cargo build + model loading
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      nodeSelector:
        kubernetes.io/hostname: 'edge-accelerator-0-1c97523c'
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        - key: fractal-fabric.ai/edge
          operator: Equal
          value: 'true'
          effect: NoSchedule
      volumes:
        - name: shared-cargo-registry
          emptyDir:
            sizeLimit: 10Gi
        - name: stt-target
          emptyDir:
            sizeLimit: 15Gi
        - name: shared-uv-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: shared-models
          emptyDir:
            sizeLimit: 5Gi
        - name: stt-logs
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stt
  namespace: speech-io
spec:
  selector:
    app: stt
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
